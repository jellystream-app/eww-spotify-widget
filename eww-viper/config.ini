# Eww Spotify Widget - configuration
# Apply changes with:  ~/.config/eww-viper/mode.sh reload
# Comments: lines starting with # or text after ;

[general]
monitor = 0              ; monitor index (0, 1, ...) or name (e.g. DP-1)
scale = 1.0              ; global size factor for everything (0.7 = smaller, 1.5 = bigger)
font = Inter             ; font family
player = spotify         ; preferred MPRIS player (name prefix)
lyrics_lead = 0.25       ; seconds, switch lyric lines slightly early
poll_ms = 250            ; update interval in milliseconds
windowtype = desktop     ; desktop or dock (try dock if the window does not show up)

[style]
text_color = #ffffff
text_opacity = 1.0       ; overall text opacity
artist_opacity = 0.75    ; artist name and time
dim_opacity = 0.45       ; neighbouring lyric lines
blur = true              ; blurred lyric lines (text-shadow trick)
blur_strength = 1.0      ; 0.5 = subtle, 2.0 = heavy
text_shadow = true       ; dark shadow behind text for readability
cover_radius = 28        ; corner radius of the cover
cover_shadow = true      ; soft shadow below the cover

[full]
; position: center, top, bottom, left, right,
;           top-left, top-right, bottom-left, bottom-right
position = center
offset_x = 0             ; distance from the anchored edge in px (before scale)
offset_y = 0             ; use ~40+ at the top, GNOME's top bar covers the first 29 px
cover_size = 300
width = 560              ; window width, also the wrap width of the lyrics
lyric_rows = 3           ; lines above and below the current one (0-5)
show_cover = true
show_title = true
show_progress = true
show_lyrics = true

[compact]
position = left
offset_x = 48
offset_y = 0
cover_size = 200
lyrics_width = 500
lyric_rows = 2
show_cover = true
show_title = true
show_progress = true
show_lyrics = true
